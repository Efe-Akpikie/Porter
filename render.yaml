services:
  - type: web
    name: porter-psychology
    runtime: node
    plan: free
    rootDir: Porter-Psychology-Portal
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_CA_CERT
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Lara Akinpelu
      - key: ADMIN_TIMEZONE
        value: America/Vancouver
      - key: DB_CONNECTION_LIMIT
        value: "5"
