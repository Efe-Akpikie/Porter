kind = "web"
previewPath = "/"
title = "Porter Psychology"
description = "A calm virtual psychology practice platform for Lara Akinpelu, with public practice information, client self-booking, and a practitioner admin calendar and client management workspace."
version = "1.0.0"
id = "artifacts/porter-psychology"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22912

[services.development]
run = "pnpm --filter @workspace/porter-psychology run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/porter-psychology", "run", "build" ]
serve = "static"
publicDir = "artifacts/porter-psychology/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22912"
BASE_PATH = "/"
